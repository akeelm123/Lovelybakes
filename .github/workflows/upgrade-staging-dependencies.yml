name: Upgrade vulnerable dependencies (staging branch)
on:
  push:
    paths:
      - '.github/workflows/upgrade-staging-dependencies.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: github.ref == 'refs/heads/feat/editorial-patisserie-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Upgrade security-affected packages and lockfile
        run: |
          npm install --save-exact next@16.4.0 sharp@0.35.5
          npm install --save-dev --save-exact eslint-config-next@16.4.0
          npm audit fix --omit=dev
      - name: Validate updated dependency graph
        run: |
          npm ci
          npx vitest run src/domain/cake-payment-policy.test.ts src/domain/cake-capacity.test.ts src/domain/cake-request-notification.test.ts src/domain/cake-environment.test.ts
          npm run lint
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Commit validated dependency update to staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade vulnerable Next.js and image dependencies"
            git push origin HEAD:feat/editorial-patisserie-foundation
          fi
